name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve production URL
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          worker_url="$(node scripts/workers-url.mjs)"
          printf 'url=%s\n' "$worker_url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Bind CMS database and apply migrations
        if: ${{ vars.KRASPRO_CONTENT_DATABASE_ID != '' }}
        env:
          KRASPRO_CONTENT_DATABASE_ID: ${{ vars.KRASPRO_CONTENT_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const databaseId = process.env.KRASPRO_CONTENT_DATABASE_ID;
          if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(databaseId)) {
            throw new Error("KRASPRO_CONTENT_DATABASE_ID must be a D1 database UUID");
          }
          const path = "wrangler.jsonc";
          const config = JSON.parse(readFileSync(path, "utf8"));
          config.d1_databases = [
            ...(config.d1_databases ?? []).filter(database => database.binding !== "KRASPRO_CONTENT"),
            { binding: "KRASPRO_CONTENT", database_name: "kraspro-content", database_id: databaseId },
          ];
          writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          JS
          npx wrangler d1 migrations apply KRASPRO_CONTENT --remote

      - name: Build Worker with OpenNext
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.worker.outputs.url }}
        run: npx @opennextjs/cloudflare build

      - name: Deploy Worker with OpenNext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx @opennextjs/cloudflare deploy

      - name: Verify production homepage
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          status="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$WORKER_URL/")"
          test "$status" = "200"
          printf 'Production homepage: %s/ (HTTP %s)\n' "$WORKER_URL" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
